<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/index.css">
  <title>Guardar y Consultar Datos de Personas</title>
</head>

<body>
  <section class="">
    <h2 class="">Formulario de Datos de Persona</h2>

    <form id="formPersona">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" required><br><br>

      <label for="dni">DNI:</label>
      <input type="text" id="dni" required><br><br>

      <label for="fechaNacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fechaNacimiento" required><br><br>

      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" required><br><br>

      <button type="button" onclick="guardarDatosPersona()">Guardar Datos</button>
    </form>

    <br>
    <h3>Datos Guardados:</h3>
    <div id="datosGuardados">No se han guardado datos aún.</div>

    <h3>Todos los Registros:</h3>
    <div id="todosRegistros"></div>
  </section>


  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
</body>

</html>
